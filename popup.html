<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>One-Click Mark as Spam — Settings</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>One-Click Mark as Spam</h1>
      <p class="subtitle">Settings</p>
    </header>

    <section class="options">
      <label class="option">
        <input type="checkbox" id="showToolbarButton" />
        <span>Show toolbar button in Gmail</span>
      </label>

      <label class="option">
        <input type="checkbox" id="showRowButtons" />
        <span>Show a spam button on each email row (on hover)</span>
      </label>

      <label class="option">
        <input type="checkbox" id="alsoDelete" />
        <span>Also click Delete after marking as spam (recommended — guarantees the email leaves the inbox)</span>
      </label>

      <label class="option">
        <input type="checkbox" id="confirmEachClick" />
        <span>Confirm before marking as spam</span>
      </label>

      <label class="option option--info">
        <span class="hint">
          Reproduces the manual workflow of clicking Report Spam, then clicking
          Delete (the trash icon right next to it). The email is reported as spam
          and moved to Trash, where Gmail removes it automatically after 30 days.
        </span>
      </label>
    </section>

    <footer>
      <span id="status" class="status" aria-live="polite"></span>
      <a href="https://mail.google.com/" target="_blank" rel="noopener">Open Gmail</a>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
