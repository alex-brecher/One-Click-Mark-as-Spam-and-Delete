<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>One-Click Mark as Spam — Settings</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>One-Click Mark as Spam</h1>
      <p class="subtitle">Settings</p>
    </header>

    <section class="options">
      <label class="option">
        <input type="checkbox" id="showToolbarButton" />
        <span>Show toolbar button in Gmail</span>
      </label>

      <label class="option">
        <input type="checkbox" id="showRowButtons" />
        <span>Show a spam button on each email row (on hover)</span>
      </label>

      <label class="option">
        <input type="checkbox" id="alsoArchive" />
        <span>Also archive after marking as spam (removes from inbox even on stubborn threads)</span>
      </label>

      <label class="option">
        <input type="checkbox" id="confirmEachClick" />
        <span>Confirm before marking as spam</span>
      </label>

      <label class="option option--info">
        <span class="hint">
          Reporting an email as spam moves it to Gmail's Spam folder, where it is
          deleted automatically after 30 days. The "Also archive" safety net handles
          conversation threads that occasionally cling to the inbox after a spam report.
        </span>
      </label>
    </section>

    <footer>
      <span id="status" class="status" aria-live="polite"></span>
      <a href="https://mail.google.com/" target="_blank" rel="noopener">Open Gmail</a>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
