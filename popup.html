<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>One-Click Mark as Spam — Settings</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>One-Click Mark as Spam</h1>
      <p class="subtitle">Settings</p>
    </header>

    <section class="options">
      <label class="option">
        <input type="checkbox" id="alsoDelete" />
        <span>Also click Delete after marking as spam (recommended — guarantees the email leaves the inbox)</span>
      </label>

      <label class="option">
        <input type="checkbox" id="autoBlockSender" />
        <span>Auto-click "Yes, block" when Gmail asks to block the sender</span>
      </label>

      <label class="option">
        <input type="checkbox" id="confirmEachClick" />
        <span>Confirm before marking as spam</span>
      </label>

      <label class="option option--info">
        <span class="hint">
          A small red circle floats over every Gmail page — <strong>drag it</strong>
          anywhere you want and the position sticks. Open an email or check one or
          more rows, then click the circle: it fires Gmail's Report Spam, dismisses
          any confirm dialog, and clicks Delete in sequence — the same workflow
          you'd do by hand.
        </span>
      </label>
    </section>

    <footer>
      <span id="status" class="status" aria-live="polite"></span>
      <a href="https://mail.google.com/" target="_blank" rel="noopener">Open Gmail</a>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
